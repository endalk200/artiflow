name: Verify Pinned npm CLI

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/publish-npm.yml
      - .github/workflows/verify-pinned-npm.yml
      - apps/cli/src/release/pinned-npm-audit.test.ts
      - apps/cli/src/release/pinned-npm-audit.ts
      - scripts/audit-pinned-npm.ts
      - scripts/harden-pinned-npm.ts
      - scripts/prepare-pinned-npm.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-npm.yml
      - .github/workflows/verify-pinned-npm.yml
      - apps/cli/src/release/pinned-npm-audit.test.ts
      - apps/cli/src/release/pinned-npm-audit.ts
      - scripts/audit-pinned-npm.ts
      - scripts/harden-pinned-npm.ts
      - scripts/prepare-pinned-npm.ts
  workflow_dispatch:

env:
  PINNED_NPM_VERSION: "11.19.0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Harden and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      - name: Set up npm
        run: npm install --global "npm@${PINNED_NPM_VERSION}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Prepare hardened npm CLI
        run: bun run scripts/prepare-pinned-npm.ts "${RUNNER_TEMP}/pinned-npm"

      - name: Verify hardened npm CLI artifact
        run: |
          cd "${RUNNER_TEMP}/pinned-npm"
          sha256sum --check "npm-${PINNED_NPM_VERSION}.sha256"

          runtime_directory="${RUNNER_TEMP}/pinned-npm-runtime"
          mkdir "${runtime_directory}"
          tar --extract --gzip \
            --file "npm-${PINNED_NPM_VERSION}-hardened.tgz" \
            --directory "${runtime_directory}"

          test "$(node "${runtime_directory}/package/bin/npm-cli.js" --version)" = "${PINNED_NPM_VERSION}"
          node "${runtime_directory}/package/bin/npm-cli.js" stage --help >/dev/null
          bun run "${GITHUB_WORKSPACE}/scripts/audit-pinned-npm.ts" "${runtime_directory}/package"
