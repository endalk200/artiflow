name: Stage npm Release

on:
  push:
    branches: [main]
    paths:
      - apps/cli/package.json
  workflow_dispatch:

env:
  PINNED_NPM_VERSION: "11.19.0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare artiflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_needed: ${{ steps.registry.outputs.release_needed }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "npm releases may only be prepared from main; got ${GITHUB_REF}." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      - name: Set up npm
        run: npm install -g "npm@${PINNED_NPM_VERSION}"

      - name: Read package version
        id: package
        run: |
          version="$(jq --raw-output .version apps/cli/package.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check npm registry
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set +e
          registry_output="$(npm view "artiflow@${PKG_VERSION}" version --json 2>&1)"
          registry_status=$?
          set -e

          if [[ ${registry_status} -eq 0 ]]; then
            echo "Version ${PKG_VERSION} already exists on npm; no release is needed."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"

            attestation_url="$(npm view "artiflow@${PKG_VERSION}" dist.attestations.url --json | jq --raw-output .)"
            provenance_payload="$({
              curl --fail --silent --show-error "${attestation_url}" |
                jq --raw-output 'first(.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle.dsseEnvelope.payload) // empty'
            })"

            if [[ -z "${provenance_payload}" ]]; then
              echo "npm has artiflow@${PKG_VERSION}, but it has no SLSA provenance attestation." >&2
              exit 1
            fi

            provenance_commit="$({
              base64 --decode <<< "${provenance_payload}" |
                jq --raw-output '
                  select(
                    .predicate.buildDefinition.externalParameters.workflow.repository == "https://github.com/endalk200/artiflow" and
                    .predicate.buildDefinition.externalParameters.workflow.path == ".github/workflows/publish-npm.yml"
                  ) |
                  first(
                    .predicate.buildDefinition.resolvedDependencies[]? |
                    select(.uri == "git+https://github.com/endalk200/artiflow@refs/heads/main") |
                    .digest.gitCommit
                  ) // empty
                '
            })"

            if [[ ! "${provenance_commit}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not resolve a trusted Artiflow main-branch commit from npm provenance." >&2
              exit 1
            fi

            if ! gh release view "artiflow-cli-v${PKG_VERSION}" >/dev/null 2>&1; then
              echo "npm has artiflow@${PKG_VERSION}, but the matching GitHub Release is missing." >&2
              echo "Recover from the original publishing run so the tag cannot point at a different commit." >&2
              exit 1
            fi

            tag_target="$(git ls-remote --tags origin "refs/tags/artiflow-cli-v${PKG_VERSION}" | awk '{ print $1 }')"
            if [[ -z "${tag_target}" ]]; then
              echo "npm and GitHub Releases contain ${PKG_VERSION}, but the matching Git tag is missing." >&2
              echo "Recover only after verifying the original publishing commit from npm provenance." >&2
              exit 1
            fi

            if [[ "${tag_target}" != "${provenance_commit}" ]]; then
              echo "Tag artiflow-cli-v${PKG_VERSION} points to ${tag_target}, but npm provenance identifies ${provenance_commit}." >&2
              exit 1
            fi

            exit 0
          fi

          if ! grep -Eq 'E404|404 Not Found' <<< "${registry_output}"; then
            printf '%s\n' "${registry_output}" >&2
            echo "Could not determine whether artiflow@${PKG_VERSION} exists on npm." >&2
            exit "${registry_status}"
          fi

          echo "Version ${PKG_VERSION} is not published; preparing a staged release."
          echo "release_needed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Bun dependencies
        if: steps.registry.outputs.release_needed == 'true'
        uses: ./.github/actions/setup-bun-dependencies

      - name: Audit release dependencies
        if: steps.registry.outputs.release_needed == 'true'
        run: >-
          bun run release:audit --workspace apps/cli
          --include @biomejs/biome --include esbuild --include turbo

      - name: Check CLI formatting
        if: steps.registry.outputs.release_needed == 'true'
        run: bun --filter artiflow format:check

      - name: Check CLI types
        if: steps.registry.outputs.release_needed == 'true'
        run: bunx turbo run check-types --filter=artiflow

      - name: Lint CLI
        if: steps.registry.outputs.release_needed == 'true'
        run: bunx turbo run lint --filter=artiflow

      - name: Test CLI
        if: steps.registry.outputs.release_needed == 'true'
        run: bunx turbo run test --filter=artiflow

      - name: Build CLI
        if: steps.registry.outputs.release_needed == 'true'
        run: bunx turbo run build --filter=artiflow

      - name: Pack and verify npm package
        if: steps.registry.outputs.release_needed == 'true'
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/artiflow-npm-release
        run: bun run scripts/verify-npm-package.ts "${ARTIFACT_DIRECTORY}"

      - name: Smoke test verified npm package
        if: steps.registry.outputs.release_needed == 'true'
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/artiflow-npm-release
          PKG_VERSION: ${{ steps.package.outputs.version }}
        run: bun run scripts/smoke-npm-package.ts "${ARTIFACT_DIRECTORY}/artiflow-${PKG_VERSION}.tgz"

      - name: Record package checksum
        if: steps.registry.outputs.release_needed == 'true'
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/artiflow-npm-release
          PKG_VERSION: ${{ steps.package.outputs.version }}
        working-directory: ${{ runner.temp }}/artiflow-npm-release
        run: sha256sum "artiflow-${PKG_VERSION}.tgz" > "artiflow-${PKG_VERSION}.tgz.sha256"

      - name: Prepare the pinned npm CLI
        if: steps.registry.outputs.release_needed == 'true'
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/artiflow-npm-release
        run: bun run scripts/prepare-pinned-npm.ts "${ARTIFACT_DIRECTORY}"

      - name: Upload verified npm package
        if: steps.registry.outputs.release_needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artiflow-npm-${{ steps.package.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/artiflow-npm-release/artiflow-${{ steps.package.outputs.version }}.tgz
            ${{ runner.temp }}/artiflow-npm-release/artiflow-${{ steps.package.outputs.version }}.tgz.sha256
            ${{ runner.temp }}/artiflow-npm-release/npm-${{ env.PINNED_NPM_VERSION }}.tgz
            ${{ runner.temp }}/artiflow-npm-release/npm-${{ env.PINNED_NPM_VERSION }}-hardened.tgz
            ${{ runner.temp }}/artiflow-npm-release/npm-${{ env.PINNED_NPM_VERSION }}.sha256

  stage:
    name: Stage artiflow
    needs: prepare
    if: needs.prepare.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      - name: Download verified npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artiflow-npm-${{ needs.prepare.outputs.version }}
          path: release-artifact

      - name: Verify package checksum
        working-directory: release-artifact
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sha256sum --check "artiflow-${PKG_VERSION}.tgz.sha256"
          sha256sum --check "npm-${PINNED_NPM_VERSION}.sha256"

      - name: Extract pinned npm CLI
        run: |
          mkdir npm-cli
          tar --extract --gzip \
            --file "release-artifact/npm-${PINNED_NPM_VERSION}-hardened.tgz" \
            --directory npm-cli

      - name: Stage package on npm
        env:
          PKG_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node npm-cli/package/bin/npm-cli.js stage publish
          "./release-artifact/artiflow-${PKG_VERSION}.tgz"
          --access public --tag latest --provenance

  github-release:
    name: Draft GitHub Release
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          tag="artiflow-cli-v${VERSION}"
          remote_target="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{ print $1 }')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "${remote_target}" && "${remote_target}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} points to ${remote_target}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi

          if [[ -z "${remote_target}" ]]; then
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "${tag}"
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          notes_source="docs/releases/artiflow-cli-v${VERSION}.md"
          if [[ -f "${notes_source}" ]]; then
            cp "${notes_source}" "${notes}"
          else
            cat > "${notes}" <<EOF
          artiflow ${VERSION}

          The npm package has been staged and is pending npm-side maintainer approval with 2FA.
          Publish this GitHub Release only after approving the staged package in npm.

          Install after approval with:

              npm install --global artiflow@${VERSION}
          EOF
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${tag}" --json isDraft --jq .isDraft)" != true ]]; then
              echo "GitHub Release ${tag} is already public before npm approval." >&2
              exit 1
            fi
            gh release edit "${tag}" --title "Artiflow CLI v${VERSION}" --notes-file "${notes}"
          else
            gh release create "${tag}" --draft --title "Artiflow CLI v${VERSION}" --notes-file "${notes}"
          fi
