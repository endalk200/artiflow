services:
  postgres:
    image: postgres:17.6
    container_name: nextjs-launchkey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-launchkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchkey}
      POSTGRES_DB: ${POSTGRES_DB:-launchkey}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
